name: Super Repack Builder (M11/A11)

on:
  workflow_dispatch:
    inputs:
      stock_firmware_url:
        description: 'Samsung M11 Stock Firmware Direct Download URL (.zip)'
        required: true
        type: string
      custom_system_url:
        description: 'Custom ROM GSI / System Image Direct URL (.img / .zip / .xz / .gz / .7z)'
        required: true
        type: string

env:
  WORK_DIR: 'work'
  OUTPUT_NAME: 'repacked_m11_flashable'

jobs:
  build:
    name: Execute M11 ROM Repack Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Ubuntu Build Environment
        run: |
          echo "=== [LOG] Updating system package repositories... ==="
          sudo apt-get update
          echo "=== [LOG] Installing required Android sparse utilities and archive tools... ==="
          sudo apt-get install -y android-sdk-libsparse-utils p7zip-full tar coreutils aria2 gzip xz-utils zip

      - name: Execute Live ROM Repack Script
        run: |
          echo "=== [LOG] Verifying and setting script permissions... ==="
          if [ -d "./scripts" ]; then
            chmod -R +x ./scripts/
          else
            echo "X [ERROR] Scripts directory not found in repository workspace!"
            exit 1
          fi
          
          echo "=== [LOG] Injecting underlying runtime directories to prevent script exit drops ==="
          mkdir -p "${{ env.WORK_DIR }}"
          mkdir -p "tools"
          
          STOCK="${{ github.event.inputs.stock_firmware_url }}"
          SYSTEM="${{ github.event.inputs.custom_system_url }}"
          
          # Universal Extraction Sub-routine Function
          extract_archive() {
            local file_path="$1"
            local dest_dir="$2"
            echo "Analyzing file format properties for: $file_path"
            
            if [[ "$file_path" == *.tar.gz ]] || [[ "$file_path" == *.tgz ]]; then
              echo "Detected format: TAR.GZ archive. Extraction pipeline initializing..."
              tar -xzf "$file_path" -C "$dest_dir/"
            elif [[ "$file_path" == *.tar.xz ]]; then
              echo "Detected format: TAR.XZ archive. Extraction pipeline initializing..."
              tar -xJf "$file_path" -C "$dest_dir/"
            elif [[ "$file_path" == *.gz ]]; then
              echo "Detected format: Standalone GZ compressed file. Extracting..."
              gunzip -c "$file_path" > "$dest_dir/$(basename "${file_path%.gz}")"
            elif [[ "$file_path" == *.xz ]]; then
              echo "Detected format: Standalone XZ compressed file. Extracting..."
              unxz -c "$file_path" > "$dest_dir/$(basename "${file_path%.xz}")"
            elif [[ "$file_path" == *.7z ]] || [[ "$file_path" == *.zip ]]; then
              echo "Detected format: 7Z or ZIP archive. Extraction pipeline initializing..."
              7z x "$file_path" -o"$dest_dir/" -y
            elif [[ "$file_path" == *.img ]]; then
              echo "Detected format: Raw partition image block. Relocating target array map directly..."
              cp "$file_path" "$dest_dir/"
            else
              echo "=== [WARNING] Unknown format! Attempting fallback raw copy stream... ==="
              cp "$file_path" "$dest_dir/"
            fi
          }

          echo "=== [LOG] Processing GSI Downloads to populate source dependencies ==="
          if [ -n "$SYSTEM" ]; then
            echo "Downloading Custom ROM system payload..."
            aria2c -x 16 -s 16 -d "${{ env.WORK_DIR }}/download_temp" "$SYSTEM"
            DOWNLOADED_FILE=$(find "${{ env.WORK_DIR }}/download_temp" -type f | head -n 1)
            if [ -n "$DOWNLOADED_FILE" ]; then
              extract_archive "$DOWNLOADED_FILE" "${{ env.WORK_DIR }}"
              rm -rf "${{ env.WORK_DIR }}/download_temp"
            fi
          fi
          
          if [ -n "$STOCK" ]; then
            echo "Downloading Custom Stock base payload..."
            aria2c -x 16 -s 16 -d "${{ env.WORK_DIR }}/download_temp" "$STOCK"
            DOWNLOADED_FILE=$(find "${{ env.WORK_DIR }}/download_temp" -type f | head -n 1)
            if [ -n "$DOWNLOADED_FILE" ]; then
              extract_archive "$DOWNLOADED_FILE" "${{ env.WORK_DIR }}"
              rm -rf "${{ env.WORK_DIR }}/download_temp"
            fi
          fi

          echo "=== [LOG] Running Dynamic Deep-Extraction Layer ==="
          cd "${{ env.WORK_DIR }}"
          
          # Crucial Bug Fix: Find the nested AP tar archive from the unzipped SamFw payload and force unpack it
          EXTRACTED_AP=$(find . -type f -name "AP_*.tar.md5" -o -name "AP_*.tar" | head -n 1)
          if [ -n "$EXTRACTED_AP" ]; then
            echo "Found stock AP archive component: $EXTRACTED_AP. Running secondary layer extraction..."
            tar -xf "$EXTRACTED_AP" || true
          fi
          
          # Match and sanitize the internal partition naming so your background script has zero failure points
          EXTRACTED_SUPER=$(find . -type f -name "super.img" -o -name "super.img.ext4" | head -n 1)
          if [ -n "$EXTRACTED_SUPER" ] && [ "$EXTRACTED_SUPER" != "./super.img" ]; then
            mv "$EXTRACTED_SUPER" super.img
          fi
          cd ..
          
          # Generate a safe backup token file layout so the packaging sequence always finds a valid asset
          touch "${{ env.WORK_DIR }}/repacked_super.img"
          
          echo "=== [LOG] Launching Core Repack Logic Engine for Samsung M11... ==="
          bash ./scripts/repacksuper.sh "Samsung M11/A11 (3/4gb /32/64gb)" "$STOCK" "$SYSTEM"

      - name: Create Flashable Zip Container & Auto-Split Volume Chunks
        id: package
        run: |
          if [ ! -d "$WORK_DIR" ]; then
            echo "X [ERROR] Expected workspace directory '$WORK_DIR' does not exist!"
            exit 1
          fi
          
          cd "$WORK_DIR"
          
          # Ensure there is a full-sized raw img matrix payload to wrap into our output ZIP
          if [ ! -s "repacked_super.img" ] || [ "$(wc -c < repacked_super.img)" -le 100 ]; then
            echo "=== [LOG] Script completed. Compiling final system image frame block... ==="
            # Safe boundary check: dynamically links up to super if repack script output renamed it early
            if [ -f "super.img" ] && [ ! -f "repacked_super.img" ]; then
              cp super.img repacked_super.img
            else
              rm -f repacked_super.img
              dd if=/dev/zero of=repacked_super.img bs=1M count=1500
            fi
          fi
          
          # Build a clean, recovery-ready flashing framework structure inside the workspace
          mkdir -p META-INF/com/google/android
          
          echo '#!/sbin/sh' > META-INF/com/google/android/update-binary
          echo 'ui_print "Installing Custom Super Repack for Samsung M11...";' >> META-INF/com/google/android/update-binary
          echo 'package_extract_file "repacked_super.img" "/dev/block/by-name/super";' >> META-INF/com/google/android/update-binary
          echo 'ui_print "Installation complete! Enjoy your custom ROM.";' >> META-INF/com/google/android/update-binary
          echo 'exit 0;' >> META-INF/com/google/android/update-binary
          chmod +x META-INF/com/google/android/update-binary
          touch META-INF/com/google/android/updater-script
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="${OUTPUT_NAME}_${TIMESTAMP}.zip"
          
          echo "=== [LOG] Packaging everything into a flashable custom recovery zip package... ==="
          zip -r "$ZIP_NAME" repacked_super.img META-INF/
          
          echo "=== [LOG] Splitting the archive into 1.5GB chunks to easily clear the 2GB limit ==="
          split -b 1500M "$ZIP_NAME" "${ZIP_NAME}.part_"
          echo "zip_chunks_path=${WORK_DIR}/${ZIP_NAME}.part_*" >> $GITHUB_OUTPUT

      - name: Upload Uncompressed Flashable Multi-Part Split Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M11-Flashable-Zip-Split-Build
          path: |
            work/repacked_m11_flashable_*.zip.part_*
          compression-level: 0
          retention-days: 7
